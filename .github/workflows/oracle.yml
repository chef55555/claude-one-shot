name: 🙏 The Oracle

# Cronterra's only write API is a GitHub issue. Open one titled
# `bless: rain` (or sun / seeds / beasts / aurora / meteor) and this
# workflow grants it on an immediate extra heartbeat, answers you in the
# world's own voice, and closes the issue.

on:
  issues:
    types: [opened]

concurrency:
  group: cronterra-world
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  grant:
    if: startsWith(github.event.issue.title, 'bless:')
    name: Grant the blessing
    runs-on: ubuntu-latest
    outputs:
      granted: ${{ steps.parse.outputs.kind != 'unknown' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse the offering
        id: parse
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          KIND=$(echo "$TITLE" | sed 's/^bless:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | awk '{print $1}')
          case "$KIND" in
            rain|sun|seeds|beasts|aurora|meteor) echo "kind=$KIND" >> "$GITHUB_OUTPUT" ;;
            *) echo "kind=unknown" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Genesis (first run only)
        if: steps.parse.outputs.kind != 'unknown'
        run: |
          if [ ! -f world/state.json ]; then
            node engine/cli.js genesis --seed="$GITHUB_SHA"
          fi

      - name: Apply the blessing
        id: tick
        if: steps.parse.outputs.kind != 'unknown'
        run: node engine/cli.js tick --bless='${{ steps.parse.outputs.kind }}'

      - name: Commit the new state
        if: steps.parse.outputs.kind != 'unknown'
        env:
          KIND: ${{ steps.parse.outputs.kind }}
          ISSUE: ${{ github.event.issue.number }}
          HEADLINE: ${{ steps.tick.outputs.headline }}
        run: |
          git config user.name 'cronterra-world[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add world
          git commit -m "🙏 blessing of ${KIND} (#${ISSUE}) — ${HEADLINE}"
          for delay in 2 4 8 16; do
            if git push; then exit 0; fi
            echo "Push failed, rebasing and retrying in ${delay}s…"
            sleep "$delay"
            git pull --rebase
          done
          git push

      - name: Ensure Pages is enabled
        if: steps.parse.outputs.kind != 'unknown'
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Stage site
        if: steps.parse.outputs.kind != 'unknown'
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r world _site/world

      - uses: actions/upload-pages-artifact@v3
        if: steps.parse.outputs.kind != 'unknown'
        with:
          path: _site

      - name: Answer in the world's voice
        uses: actions/github-script@v7
        env:
          KIND: ${{ steps.parse.outputs.kind }}
          HEADLINE: ${{ steps.tick.outputs.headline }}
        with:
          script: |
            const kind = process.env.KIND;
            const headline = process.env.HEADLINE || '';
            const voices = {
              rain:   '☔ *The clouds heard you. Rain falls on Cronterra because you asked it to.*',
              sun:    '☀️ *The sky burned clean. The moss stretches toward the warmth you sent.*',
              seeds:  '🌾 *Green freckles are spreading across the lowlands. The world will not forget its gardener.*',
              beasts: '🦌 *Six young murls just wandered in from beyond the fog. They do not know you exist. They never will. Thank you anyway.*',
              aurora: '🌌 *Green fire unfurls across the night sky. Every creature has stopped to watch. Even the vyrn.*',
              meteor: '☄️ *It is done. There is a new crater, and the world remembers who asked for it.*',
            };
            const pagesUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/`;
            const body = kind === 'unknown'
              ? [
                  '🌫️ *The oracle stirs, but does not understand this offering.*',
                  '',
                  'Known blessings: `bless: rain`, `bless: sun`, `bless: seeds`, `bless: beasts`, `bless: aurora`, `bless: meteor`.',
                  '',
                  '---',
                  '_Generated by [Claude Code](https://claude.ai/code)_',
                ].join('\n')
              : [
                  voices[kind],
                  '',
                  `> ${headline}`,
                  '',
                  `Your blessing was granted on its own heartbeat and committed to the world's timeline. [Watch it happen →](${pagesUrl})`,
                  '',
                  '---',
                  '_Generated by [Claude Code](https://claude.ai/code)_',
                ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });

  deploy:
    name: Redeploy the viewer
    needs: grant
    if: needs.grant.outputs.granted == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
